name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs. Every other run is keyed by commit so it
# always finishes: main saves the Cargo caches and triggers auto-release.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      activation: ${{ steps.scope.outputs.activation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.13"
      - id: scope
        name: Select required check groups
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/checks/ci_scope.py

  # Advisory: the required gate ignores this job, and a failed step only warns.
  # It records outcomes and grades nothing. Docs-only changes plan no python group.
  campaign:
    needs: [plan]
    if: contains(needs.plan.outputs.matrix, 'python')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: campaign
        name: Test the harness, then run the campaign twice and compare
        continue-on-error: true
        run: |
          python3 -m unittest discover -s tests/quality -p 'check_*.py'
          python3 scripts/quality/campaign.py --manifest tests/quality/campaign.json --verify
      - name: Warn about a campaign failure
        if: steps.campaign.outcome == 'failure'
        run: echo "::warning title=Advisory campaign::The deterministic campaign check failed; it does not block merging."

  check:
    needs: [plan]
    name: check (${{ matrix.group }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Incremental artifacts only bloat the dependency cache; CI never rebuilds in place.
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Integration jobs also carry their runner's native activation checks when planned.
      - name: Record native runner
        if: matrix.system
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          printf '%s %s %s\n' "$ACTUAL_ARCH" "$ImageOS" "$ImageVersion"
          native="$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]')"
          native="${native/arm64/aarch64}"
          test "$native" = "$EXPECTED_SYSTEM"
      - name: Require a fresh Flox installation
        run: |
          if command -v nix >/dev/null || command -v flox >/dev/null; then
            echo "Expected a fresh runner without Nix or Flox" >&2
            exit 1
          fi
      # The install action retries its download for only about 20 seconds.
      - name: Wait for the Flox download host
        run: bash scripts/ci/await-host.sh https://downloads.flox.dev/by-env/stable/
      - id: flox
        name: Install pinned Flox
        uses: flox/install-flox-action@61d86f71ca9fc8061fea04e5bc5e3a8206423dca
        with:
          version: "1.19.1"
          disable-metrics: "true"
          disable-upgrade-notifications: "false"
          github-token: ""
          floxhub-token: ""
          use-cache: "false"
          # Nix doubles its delay between download attempts: ten attempts outlast
          # a few minutes of DNS failure where the default five lasted under one.
          extra-nix-config: download-attempts = 10
      - name: Verify the selected environment
        env:
          FOUNDRY_FLOX: ${{ steps.flox.outputs.flox-path }}
        run: bash scripts/ci/flox.sh true
      - name: Install frozen tooling dependencies
        if: matrix.bun
        run: bash scripts/ci/flox.sh bun install --frozen-lockfile --ignore-scripts
      - name: Install pinned browser
        if: matrix.browser
        run: bash scripts/ci/flox.sh bun run docs:browser
      - name: Permit pinned browser sandbox
        if: matrix.browser
        run: bash scripts/ci/browser-sandbox.sh
      # Keyed by toolchain, build profiles and dependency locks; main saves, pull requests only restore.
      - id: cargo-cache
        name: Restore Cargo dependencies and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-${{ hashFiles('.flox/env/manifest.lock', 'Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-${{ hashFiles('.flox/env/manifest.lock', 'Cargo.toml') }}-
      - name: Activate and exercise the locked toolchain
        if: matrix.system
        env:
          FOUNDRY_FLOX: ${{ steps.flox.outputs.flox-path }}
        run: bash scripts/ci/flox.sh python3 scripts/ci/flox_verify.py --smoke
      - name: Compile native application dependencies
        if: matrix.system
        run: bash scripts/ci/flox.sh cargo check --locked --package f5y --all-targets
      - name: Run shared checks
        env:
          FOUNDRY_NAMING_POLICY: ${{ secrets.FOUNDRY_NAMING_POLICY }}
          CHECKS: ${{ matrix.checks }}
        run: |
          read -ra checks <<< "$CHECKS"
          bash scripts/ci/flox.sh python3 scripts/checks/all.py --group "${checks[@]}"
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- .flox/env/manifest.lock Cargo.lock bun.lock .flox/toolchain/flake.lock
      - name: Save Cargo dependencies and build output
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  activation:
    needs: [plan]
    # Empty when every planned system runs inside an integration job.
    if: needs.plan.outputs.activation != '{"include":[]}'
    name: activation (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.activation) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record native runner
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          printf '%s %s %s\n' "$ACTUAL_ARCH" "$ImageOS" "$ImageVersion"
          native="$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]')"
          native="${native/arm64/aarch64}"
          test "$native" = "$EXPECTED_SYSTEM"
      - name: Require a fresh Flox installation
        run: |
          if command -v nix >/dev/null || command -v flox >/dev/null; then
            echo "Expected a fresh runner without Nix or Flox" >&2
            exit 1
          fi
      # The install action retries its download for only about 20 seconds.
      - name: Wait for the Flox download host
        run: bash scripts/ci/await-host.sh https://downloads.flox.dev/by-env/stable/
      - id: flox
        name: Install pinned Flox
        uses: flox/install-flox-action@61d86f71ca9fc8061fea04e5bc5e3a8206423dca
        with:
          version: "1.19.1"
          disable-metrics: "true"
          disable-upgrade-notifications: "false"
          github-token: ""
          floxhub-token: ""
          use-cache: "false"
          # Nix doubles its delay between download attempts: ten attempts outlast
          # a few minutes of DNS failure where the default five lasted under one.
          extra-nix-config: download-attempts = 10
      - name: Activate and exercise the locked toolchain
        env:
          FOUNDRY_FLOX: ${{ steps.flox.outputs.flox-path }}
        run: bash scripts/ci/flox.sh python3 scripts/ci/flox_verify.py --smoke
      - name: Compile native application dependencies
        run: bash scripts/ci/flox.sh cargo check --locked --package f5y --all-targets
      - name: Require unchanged locks
        run: git diff --exit-code -- .flox/env/manifest.lock .flox/toolchain/flake.lock Cargo.lock bun.lock

  required:
    name: required
    if: always()
    needs: [plan, check, activation]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # A macOS job GitHub never assigned a runner is excused only when the same
      # commit has a successful local macOS verification status.
      - name: Require every check to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          ACTIVATION_RESULT: ${{ needs.activation.result }}
          ACTIVATION_PLAN: ${{ needs.plan.outputs.activation }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/required_gate.py
