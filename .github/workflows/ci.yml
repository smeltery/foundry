name: ci
run-name: Receipt diagnostic on ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a fresh Flox installation
        run: |
          if command -v nix >/dev/null || command -v flox >/dev/null; then
            echo "Expected a fresh runner" >&2
            exit 1
          fi
      - id: flox
        uses: flox/install-flox-action@61d86f71ca9fc8061fea04e5bc5e3a8206423dca
        with:
          version: "1.19.1"
          disable-metrics: "true"
          disable-upgrade-notifications: "false"
          github-token: ""
          floxhub-token: ""
          use-cache: "false"
      - name: Verify the selected environment
        env:
          FOUNDRY_FLOX: ${{ steps.flox.outputs.flox-path }}
        run: bash scripts/ci/flox.sh true
      - name: Enforce measured diagnostic LOC allocation
        env:
          FOUNDRY_FLOX: ${{ steps.flox.outputs.flox-path }}
        run: bash scripts/ci/flox.sh python3 scripts/checks/loc.py
      - name: Prepare private trace
        run: install -m 600 /dev/null "$RUNNER_TEMP/foundry-receipt-selected.log"
      - name: Reproduce selected receipt target
        env:
          FOUNDRY_FLOX: ${{ steps.flox.outputs.flox-path }}
          FOUNDRY_NAMING_POLICY: ${{ secrets.FOUNDRY_NAMING_POLICY }}
          FOUNDRY_ACK_DIAGNOSTIC: ${{ runner.temp }}/foundry-receipt-selected.log
        run: bash scripts/ci/flox.sh cargo test --workspace --locked --test daemon_receipt_deadline -- --nocapture
      - name: Reproduce full canonical Rust sequence if selected target passes
        env:
          FOUNDRY_FLOX: ${{ steps.flox.outputs.flox-path }}
          FOUNDRY_NAMING_POLICY: ${{ secrets.FOUNDRY_NAMING_POLICY }}
          FOUNDRY_ACK_DIAGNOSTIC: ${{ runner.temp }}/foundry-receipt-full.log
        run: bash scripts/ci/flox.sh python3 scripts/checks/all.py --group rust
      - name: Require unchanged locks
        if: always()
        run: git diff --exit-code -- .flox/env/manifest.lock Cargo.lock bun.lock .flox/toolchain/flake.lock
      - name: Collect bounded receipt trace
        if: always()
        run: |
          for receipt_trace in "$RUNNER_TEMP/foundry-receipt-selected.log" "$RUNNER_TEMP/foundry-receipt-full.log"; do
            if [[ -f "$receipt_trace" ]]; then
              python3 -c 'import pathlib,re,sys; rows=pathlib.Path(sys.argv[1]).read_text().splitlines(); noise=r"(batch_enter|batch_done send=0 retire=0|driver_(frame|command)_result.*error=None|event_seen.*receipt=false|event generation=.*receipt=false)"; print("\n".join([r for r in rows if not re.search(noise,r)][-5000:]))' "$receipt_trace"
            fi
          done
