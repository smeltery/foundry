name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.95.0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.13"
      - id: scope
        name: Select required check groups
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/checks/ci_scope.py

  check:
    needs: [plan]
    name: check (${{ matrix.group }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: contains(fromJSON('["rust", "dependencies", "integration", "mcp-sdk"]'), matrix.group)
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: contains(fromJSON('["adapter", "integration", "docs"]'), matrix.group)
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: contains(fromJSON('["adapter", "integration", "docs"]'), matrix.group)
        with:
          node-version: "22.23.1"
      - name: Bootstrap and verify pinned tools
        env:
          CHECK_GROUP: ${{ matrix.group }}
        run: python3 scripts/ci/bootstrap.py --group "$CHECK_GROUP"
      - name: Install frozen tooling dependencies
        if: contains(fromJSON('["adapter", "integration", "docs"]'), matrix.group)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install pinned browser
        if: matrix.group == 'docs'
        run: bun run docs:browser
      - name: Permit pinned browser sandbox
        if: matrix.group == 'docs'
        run: bash scripts/ci/browser-sandbox.sh
      - name: Run shared checks
        env:
          FOUNDRY_NAMING_POLICY: ${{ secrets.FOUNDRY_NAMING_POLICY }}
          CHECK_GROUP: ${{ matrix.group }}
        run: python3 scripts/checks/all.py --group "$CHECK_GROUP"
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- .flox/env/manifest.lock Cargo.lock bun.lock

  required:
    name: required
    if: always()
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success
