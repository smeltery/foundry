schema-version = "1.19.0"
minimum-cli-version = "1.19.1"

[install]
rustc = { pkg-path = "rustc", version = "=1.95.0" }
cargo = { pkg-path = "cargo", version = "=1.95.0" }
clippy = { pkg-path = "clippy", version = "=1.95.0" }
rustfmt = { pkg-path = "rustfmt", version = "=1.95.0" }
bun = { pkg-path = "bun", version = "=1.3.11" }
nodejs = { pkg-path = "nodejs_22", version = "=22.23.1" }
python = { pkg-path = "python313", version = "python3-3.13.13" }
pre-commit = { pkg-path = "pre-commit", version = "=4.5.1" }
cargo-deny = { pkg-path = "cargo-deny", version = "=0.19.9" }
actionlint = { pkg-path = "actionlint", version = "=1.7.12" }
shellcheck = { pkg-path = "shellcheck", version = "=0.11.0" }
git.pkg-path = "git"
pkg-config.pkg-path = "pkg-config"

[vars]
RUST_BACKTRACE = "1"

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
