[package]
name = "foundry-service"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license-file = "../../LICENSE"

[dependencies]
foundry-contracts = { version = "0.1.0", path = "../contracts" }
foundry-store = { version = "0.1.0", path = "../store" }
foundry-runtime = { version = "0.1.0", path = "../runtime" }
foundry-tools = { version = "0.1.0", path = "../tools" }
cap-std = "=4.0.3"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.11.1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
