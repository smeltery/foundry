[package]
name = "foundry-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license-file = "../../LICENSE"

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
