[package]
name = "foundry-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
repository.workspace = true

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["net", "time"] }
url = "=2.5.8"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.3", features = ["io-util", "macros", "rt-multi-thread", "time"] }
