[package]
name = "foundry-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
repository.workspace = true

[dependencies]
foundry-identity = { version = "0.1.0", path = "../identity" }
libc = "0.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
serde_json = "=1.0.154"
subtle = "=2.6.1"
tokio = { version = "=1.53.3", features = ["net", "time"] }
url = "=2.5.8"
zeroize = "=1.9.1"

[dev-dependencies]
foundry-service = { version = "0.1.0", path = "../service" }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "rt-multi-thread", "time"] }
